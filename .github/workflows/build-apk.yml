
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: |
          unzip DailyWorkReminder-Android-Project-1.zip -d source
          cd source/DailyWorkReminder
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DailyWorkReminder-APK
          path: source/DailyWorkReminder/app/build/outputs/apk/debug/app-debug.apk
