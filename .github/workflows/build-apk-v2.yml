
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip DailyWorkReminder-Android-Project-1.zip -d source

      - name: Build APK
        run: |
          cd source/DailyWorkReminder
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DailyWorkReminder-APK
          path: source/DailyWorkReminder/app/build/outputs/apk/debug/app-debug.apk
